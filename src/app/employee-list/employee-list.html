<div class="container mt-4">
  <h2>Employees</h2>

  <a routerLink="/add" class="btn btn-primary mb-3">Add</a>

  <table class="table table-bordered">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Actions</th>
    </tr>

    <tr *ngFor="let e of employees">
      <td>{{e.name}}</td>
      <td>{{e.email}}</td>
      <td>
        <button class="btn btn-danger" (click)="delete(e.id!)">Delete</button>
      </td>
    </tr>
  </table>
</div>
